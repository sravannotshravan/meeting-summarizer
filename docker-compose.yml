services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: charchanotes-llama-server
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - llama-cache:/root/.cache
    command:
      - -hf
      - Qwen/Qwen3-8B-GGUF:Q4_K_M
      - -ngl
      - "${LLAMA_N_GPU_LAYERS:-99}"
      - -c
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: charchanotes-backend
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      HF_TOKEN: "${HF_TOKEN:?HF_TOKEN is required. Run ./docker-setup.sh}"
      HF_HOME: /root/.cache/huggingface
      LLAMA_URL: http://llama-server:8080/v1/chat/completions
      LLAMA_MODEL: Qwen3-8B
      WHISPER_CLI_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /models/whisper/ggml-small.bin
      CORS_ORIGINS: "*"
    volumes:
      - ./data:/app/data
      - whisper-models:/models/whisper
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    container_name: charchanotes-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  llama-cache:
    name: charchanotes-llama-cache
  hf-cache:
    name: charchanotes-hf-cache
  whisper-models:
    name: charchanotes-whisper-models
