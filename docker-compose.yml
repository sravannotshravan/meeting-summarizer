services:
  # ============================================================
  # 1. Local LLM Server (llama.cpp)
  # ============================================================
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: meetingai-llama-server
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - ${LLAMA_MODELS_DIR:-./models}:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/${LLAMA_MODEL_FILE:-qwen3-8b.gguf}
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_N_GPU_LAYERS=${LLAMA_N_GPU_LAYERS:-0}
    command: >
      -m /models/${LLAMA_MODEL_FILE:-qwen3-8b.gguf}
      --port 8080
      --host 0.0.0.0
      -c 8192
      -ngl ${LLAMA_N_GPU_LAYERS:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # 2. FastAPI Backend (Whisper + Pyannote + SQLite)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meetingai-backend
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - LLAMA_URL=http://llama-server:8080/v1/chat/completions
      - LLAMA_MODEL=${LLAMA_MODEL:-Qwen3-8B}
      - WHISPER_CLI_PATH=/usr/local/bin/whisper-cli
      - WHISPER_MODEL_PATH=/models/whisper/ggml-small.bin
      - CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # 3. React Frontend (Vite + Nginx Reverse Proxy)
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: meetingai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  hf-cache:
    name: meetingai-hf-cache
